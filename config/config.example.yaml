# Methanics 설정 예시 — /etc/methanics/config.yaml 로 복사해 고칩니다 (명세 15장).
# 설치 스크립트(Methanics-HMI-Public install.sh)가 처음 한 번 복사합니다. 업데이트해도 덮어쓰지 않습니다.
# 관리자 PIN 이 들어가므로 권한은 앱 사용자만 읽기(0640)입니다.
# 없는 키는 기본값을 씁니다. 범위 밖 값은 범위 안으로 맞추고 설정 화면에 표시합니다.

device_id: MTX-0001
language: ko              # 화면 처음 언어 ko · ru · en — [정보] → 시스템 → 화면 언어로 바꾸면 그 선택을 기억
site_id: ""
timezone: Asia/Bishkek

# 수동 제어 · 설정 화면 잠금. 현장 설치 전에 바꿉니다.
admin_pin: "1234"

# true 면 실제 포트 대신 시뮬레이터로 동작합니다. 현장 장비에서는 절대 켜지 않습니다.
simulate: false

# 현장 장비는 M.2 NVMe 로 부팅합니다. SD 카드로 켜지면(NVMe 고장 · 빠짐) 상단에 「SD 부팅」을 띄우고 관제 서버에 진단을 보냅니다.
# NVMe 없이 SD 로만 시험하는 장비는 false.
expect_nvme: true

# 시리얼 포트. 보통은 고치지 않습니다 — 앱 설정 화면 「통신 포트」에서 USB 변환기를 골라 두면
# 칩 시리얼 번호(/dev/serial/by-id)로 기억해(/var/lib/methanics/ports.json) 이 값보다 먼저 씁니다. USB 구멍을 바꿔 꽂아도 그대로입니다.
# 아래 /dev/mtx-* 는 udev 규칙(99-methanics-serial.rules)을 쓸 때의 이름입니다.
ports:
  modbus: /dev/mtx-modbus   # FUS-1T · RS-485 버스 #1 · 9600 8N1 · CH₄ Gasboard-2502 · GMP252 · EE650 · 센서노드
  iontec: /dev/mtx-iontec   # FUS-1T (아이온텍 공용) · 9600 8N1 · IOC-100 + BPC-100 공용 (BPC-100 은 9600 공용 회선 펌웨어 필요)
  iontec_baud: 9600

addresses:
  gmp252: 240
  ee650: 65
  sensor_node: 1
  ioc_id: 1
  ioc_gw: 1
  bpc_id: 1
  bpc_gw: 1
  ch4: 200                  # Cubic Gasboard-2502 출하 기본 · 공용 주소 0xC8

# 머리 진입 포토센서 (BEN300 PNP → 절연 입력 P3013-2 → RPi GPIO, 내부 풀업). 핀 · 극성은 설치 때 확인
gpio:
  enabled: true
  chip: ""                  # 비우면 RP1 칩 자동 (gpiochip0 · gpiochip4)
  head_line: 17             # BCM 번호 (헤더 11번 핀)
  head_active_high: false   # 머리가 있을 때 HIGH 면 true (포토커플러 출력은 보통 LOW)

# 방문 사진 카메라 (Arducam B0448 UVC — 리눅스 기본 드라이버). 앱이 ffmpeg 로 한 장씩 받는다
camera:
  enabled: true
  device: /dev/video0       # 카메라가 하나면 그대로. 바뀌면 /dev/v4l/by-id/usb-…-video-index0
  width: 1920
  height: 1080
  thumb_width: 480          # 서버로 올리는 대표 사진 축소본 (약 30 KB)

# 운전
warmup_min: 30
sleep_rewarm_min: 10

# 방문 판정 (6장)
head_on_debounce_s: 0.5
head_window_s: 10
head_in_min_s: 2
head_off_end_s: 30
visit_max_s: 900
good_min_s: 120
bkg_pre_s: 120
bkg_post_s: 120
gas_lag_s: 0

# 급이 (7장) — 현 펌웨어 100 g 단위 기준. 펌웨어 보완 후 8 · 25 · 35
drops_per_visit: 3
drop_interval_s: 60
drop_mass_g: 100
feed_window: "05:00~22:00"
# daily_feed_cap_kg: 20
photo_interval_s: 10
light_off_delay_s: 90
light_always_on: false
night_window: "19:00~06:00"

# 풍량 · 교정 (8 · 9장)
pipe_area_m2: 0.0080073
ff: 1.0
# 교정 계수 처음 값 — 교정에 성공하면 앱이 데이터 폴더 calibration.json 에 새 계수를 남기고 그것을 먼저 쓴다
f_ch4: 1.0
f_co2: 1.0
zero_raw_ch4: 0
zero_raw_co2: 0
f_low_ch4: 1.0
# Span 실린더 인증값 (합성공기 바탕) — 없으면 교정하지 않는다 (교정 만료 경보)
# span_ch4_ppm: 500
# span_co2_ppm: 5000
cal_time: "02:00"          # 매일 자동 교정 (현지 시각)
cal_valid_h: 48            # 마지막 성공 교정 뒤 이 시간이 지나면 교정 만료 (방문 무효)
cal_gas_s: 90              # Zero · Span 주입 [GreenFeed 90 s]
cal_pause_s: 60            # 가스 사이 대기 [GreenFeed 60 s]
cal_purge_s: 60            # 마지막 퍼지
cal_quiet_min: 5           # 최근 이 분 동안 머리 진입이 없어야 자동 교정 시작 (아니면 5분 뒤 다시, 최대 6회)
zero_tol_ch4: 5            # Zero 허용 오차 ppm
zero_tol_co2: 50

# 경보 (12장)
flow_filter_Ls: 26.99
flow_off_Ls: 2
high_ch4_ppm: 4000         # GreenFeed 기준. 센서 상한(1,000 ppm)에 닿아 있는 것도 같은 경보 (high_ch4_s 지속)
high_ch4_s: 120
box_heat_on_C: 5
box_heat_off_C: 15
rfid_enabled: false

# ── 업데이트 · 서버 (명세에 없음 — 배포 방식에서 정함) ─────────────────────
# 앱 업데이트: 공개 저장소 Releases 의 패키지를 받는다 (토큰 없음). 정보 화면 [확인] [받기] [적용].
update:
  repo: BlessingQ/Methanics-HMI-Public
  channel: stable        # stable | beta (beta 면 vX.Y.Z-beta.N 도 받음)
  auto: false            # true 면 check_interval_h 마다 확인 → 받기 → 적용(재시작). 교정 중에는 미룸
  check_interval_h: 6

# IONTEC IoT 관제 서버 (iontec-iot-server): 온라인 · 운전 상태 실시간 표시(WebSocket), 원격 진단, 원격 업데이트,
# 1분 평균 측정 기록 업로드(대시보드 「측정 기록」 표 · 엑셀). 서버 v0.8.0 이상.
# 처음 연결하면 대시보드에 「메타닉스 · 승인 대기」로 나타납니다 → 관리자가 승인. 장비 ID 는 rpi-<Pi 시리얼> 자동.
# 측정 기록은 승인 뒤부터 보내고, 그 전 기록은 장비에 최대 7일 쌓아 두었다가 이어서 보냅니다.
iot:
  enabled: true
  server_url: wss://iot.ionteclab.com/ws/device
  upload: true           # 1분 평균 측정 기록 업로드 (시뮬레이션 중에는 보내지 않음)
